name: Descomprimir canciones123.zip

on:
  push:
    paths:
      - "canciones123.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer el zip en la carpeta musica/
        run: |
          if [ ! -f canciones123.zip ]; then echo "No hay zip, nada que hacer"; exit 0; fi
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q canciones123.zip -d /tmp/x
          src=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then
            src="/tmp/x/$(ls -A /tmp/x)"
          fi
          mkdir -p musica
          cp -a "$src"/. musica/
          rm canciones123.zip

      - name: Guardar los cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Descomprimir canciones123.zip en musica/" && git push)
