<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fondo: corazones</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#120414}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,P=[];const D=Math.min(devicePixelRatio||1,2);
function rs(){W=c.width=innerWidth*D;H=c.height=innerHeight*D;P=Array.from({length:40},()=>mk(true))}
function mk(any){return{x:Math.random()*W,y:any?Math.random()*H:H+20*D,r:(Math.random()*18+8)*D,v:(Math.random()*.5+.2)*D,a:Math.random()*6.28,h:300+Math.random()*60}}
function heart(px,py,s){x.beginPath();x.moveTo(px,py+s*.3);x.bezierCurveTo(px,py,px-s*.5,py,px-s*.5,py+s*.3);x.bezierCurveTo(px-s*.5,py+s*.6,px,py+s*.8,px,py+s);x.bezierCurveTo(px,py+s*.8,px+s*.5,py+s*.6,px+s*.5,py+s*.3);x.bezierCurveTo(px+s*.5,py,px,py,px,py+s*.3);x.fill()}
function f(t){x.fillStyle='rgba(18,4,20,.25)';x.fillRect(0,0,W,H);for(const p of P){p.y-=p.v;p.a+=.01;x.globalAlpha=.5;x.fillStyle='hsl('+p.h+',90%,65%)';heart(p.x+Math.sin(p.a)*20*D,p.y,p.r*2);x.globalAlpha=1;if(p.y<-60*D)Object.assign(p,mk(false));}requestAnimationFrame(f)}
addEventListener('resize',rs);rs();requestAnimationFrame(f);
</script></body></html>
